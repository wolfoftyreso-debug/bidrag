# Template only — create real secrets with your secret manager
# (External Secrets Operator / AWS Secrets Manager), never commit values.
apiVersion: v1
kind: Secret
metadata:
  name: bidrag-secrets
type: Opaque
stringData:
  database-url: postgres://USER:PASSWORD@HOST:5432/bidrag
  auth-secret: GENERATE_WITH_openssl_rand_hex_32
  field-encryption-key: GENERATE_WITH_openssl_rand_hex_32
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bidrag-config
data:
  cors-origin: https://bidrag.example.se
  public-base-url: https://bidrag.example.se
