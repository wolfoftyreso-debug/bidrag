# Endast den publika ytan exponeras: /v1/analyze och /healthz.
# Interna endpoints (/vision/*, /knowledge/*, /verify, /interpret) nas
# enbart inom klustret via Service - de publiceras aldrig via ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: runestone-api
  namespace: runestone
  labels:
    app.kubernetes.io/name: runestone-api
    app.kubernetes.io/part-of: runestone-intelligence
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"  # mobilfoton
spec:
  rules:
    - host: api.runestone.example   # satts per miljo via overlay
      http:
        paths:
          - path: /v1/analyze
            pathType: Prefix
            backend:
              service:
                name: runestone-api
                port: { name: http }
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: runestone-api
                port: { name: http }
