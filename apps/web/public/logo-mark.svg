<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Bidragskoll">
  <!-- Designsystem "Signal", enda källan för märket. En taklinje med en bock
       under, på en rundad blå ruta: hem och bedömt i en form. Två streckvikter,
       runda ändar, inga gradienter. Taket bär tokenen primary-light, bocken
       ytans ton. I små storlekar (favicon, 32px-ikonen) faller taket bort och
       bocken bär ensam — den regeln, favicon, app-ikoner och OG-bilden härleds
       ur den här filen av tools/genbrand.mjs. Skriv aldrig de filerna för hand. -->
  <rect width="40" height="40" rx="11" fill="#1273d4"/>
  <polyline points="10,20.5 20,11.5 30,20.5" fill="none" stroke="#6fb2f0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="14,25.5 18.5,30 27,21" fill="none" stroke="#fffdf9" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
