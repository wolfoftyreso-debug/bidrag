name: Runestone data contracts

on:
  push:
    paths: ['runestone-intelligence/**']
  pull_request:
    paths: ['runestone-intelligence/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate example records against schemas
        run: python3 validate_all.py
        working-directory: runestone-intelligence/data-contracts
      - name: Contract tests (provenance, split policy, model governance)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/data-contracts
      - name: Ingestion tests (signum, importers, matcher, split, e2e)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/ingestion
      - name: Benchmark tests (metrics, case building, evaluation)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/benchmark
      - name: Baseline runner tests (adapters, http_vlm parsing, e2e)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/models
      - name: Retrieval tests (similarity, GPS signal, filters)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/knowledge
      - name: Verification tests (match levels, status downgrade rules)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/verification
      - name: Translation tests (rune mapping, normalization, policy chain)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/translation
      - name: API tests (pipeline, abstention, observations, HTTP server)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/api
      - name: Explore tests (nearby, trails)
        run: python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/atlas
      - name: Manifest tests (k8s invariants)
        run: |
          pip install --quiet pyyaml
          python3 -m unittest discover -s tests -v
        working-directory: runestone-intelligence/deployment
      - name: Corpus build smoke test (deterministic fixtures)
        run: |
          python3 build_corpus.py --srd fixtures/srd_sample.jsonl \
            --images fixtures/hf_sample.jsonl \
            --out /tmp/corpus-ci --version v0.1 \
            --timestamp 2026-08-15T00:00:00Z --seed 20260815
        working-directory: runestone-intelligence/ingestion

  docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deployment/Dockerfile.api -t runestone-api:${{ github.sha }} .
        working-directory: runestone-intelligence
      - name: Smoke test image (healthz + honest 422 without reader)
        run: |
          cd runestone-intelligence
          python3 ingestion/build_corpus.py --srd ingestion/fixtures/srd_sample.jsonl \
            --images ingestion/fixtures/hf_sample.jsonl \
            --out /tmp/smoke-corpus --version v0.1 \
            --timestamp 2026-08-15T00:00:00Z --seed 8
          docker run -d --name api -p 8080:8080 \
            -v /tmp/smoke-corpus:/data/corpus:ro \
            -e OBSERVATIONS_PATH=/tmp/observations.jsonl \
            runestone-api:${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -sf localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -sf localhost:8080/healthz
          status=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST localhost:8080/v1/analyze \
            -H 'Content-Type: application/json' -d '{"image_b64": "ZmFrZQ=="}')
          cat /tmp/resp.json
          test "$status" = "422" || { echo "::error::expected honest 422 without reader, got $status"; docker logs api; exit 1; }
